<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elysium | Sprint 7 Demo</title>
<link rel="icon" href="TemplateData/favicon.ico">
<style>
*{box-sizing:border-box}body{margin:0;background:#111a24;color:#edf2f7;font-family:system-ui,sans-serif}main{max-width:1320px;margin:0 auto;padding:16px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px}h1{font-size:23px;margin:0}h1 span{font-size:15px;font-weight:400;color:#b4c6d8;margin-left:12px}button{background:#c9e6c5;color:#162c25;border:0;border-radius:5px;padding:9px 15px;cursor:pointer;font:inherit}#game{position:relative;background:#191919;aspect-ratio:16/10;border:1px solid #344659}canvas{display:block;width:100%;height:100%;outline:none}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#191919}progress{width:240px;accent-color:#9ed184}#status{font-size:14px;color:#cbd5e1}footer{font-size:13px;color:#bdcbd9;line-height:1.8;margin-top:9px}kbd{font-family:inherit;color:#fff;font-weight:650}#error{color:#ffc0b8;white-space:pre-wrap;font-size:14px}button:focus-visible{outline:3px solid white;outline-offset:3px}
</style>
</head>
<body><main>
<header><h1>Elysium <span>Sprint 7 demo</span></h1><button id="fullscreen" type="button">Full screen</button></header>
<div id="game"><canvas id="unity-canvas" width="1280" height="800" tabindex="0" aria-label="Elysium game"></canvas><div id="loading"><strong>Loading Elysium…</strong><progress id="progress" max="1" value="0"></progress><span id="status">The first load downloads the game. Keep this tab open for the presentation.</span></div></div>
<div id="error" role="alert"></div>
<footer><kbd>Space</kbd> pause/resume &nbsp; <kbd>D</kbd> speed &nbsp; <kbd>Arrow keys</kbd> move camera &nbsp; <kbd>K</kbd> fire &nbsp; <kbd>L</kbd> flood<br>For disaster tests, place a building first and close any dialogue or daily report while the game is unpaused.</footer>
</main>
<script src="Build/WebGL-Sprint7.loader.js"></script>
<script>
const canvas=document.getElementById('unity-canvas');
createUnityInstance(canvas,{
 dataUrl:'Build/WebGL-Sprint7.data',frameworkUrl:'Build/WebGL-Sprint7.framework.js',codeUrl:'Build/WebGL-Sprint7.wasm',
 streamingAssetsUrl:'StreamingAssets',companyName:'Team Like',productName:'Elysium',productVersion:'Sprint 7',
 showBanner:(message,type)=>{if(type==='error')document.getElementById('error').textContent=message}
},p=>{document.getElementById('progress').value=p}).then(instance=>{
 window.elysiumReady=true;window.elysiumInstance=instance;
 document.getElementById('loading').remove();canvas.focus();
 document.getElementById('fullscreen').onclick=()=>instance.SetFullscreen(1);
}).catch(error=>{document.getElementById('loading').remove();document.getElementById('error').textContent='The game could not load. '+error;});
</script></body></html>
